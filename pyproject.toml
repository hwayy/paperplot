[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperplot"
version = "0.1.5"
description = "Reusable Matplotlib formatting helpers for LaTeX-ready papers and slides."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Chiahwa"},
]
keywords = ["matplotlib", "latex", "figures", "papers", "slides"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib",
    "cycler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
    "tomli; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/hwayy/paperplot"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


